<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>session-map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2.5' y='12' width='9' height='8' rx='3' fill='%237c6bd6'/%3E%3Crect x='19' y='4' width='10.5' height='8' rx='3' fill='%233f8fd2'/%3E%3Crect x='19' y='20' width='10.5' height='8' rx='3' fill='%232f9a6f'/%3E%3Cpath d='M11.5 16C16 16 15 8 19 8M11.5 16C16 16 15 24 19 24' fill='none' stroke='%2394a3b8' stroke-width='1.8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4.5" y="5.5" width="15" height="14" rx="2.5"/><path d="M4.5 10h15M8.5 3.5v4M15.5 3.5v4"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M14 7l-5 5 5 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5.5 12h13"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4.5 9V4.5H9M15 4.5h4.5V9M19.5 15v4.5H15M9 19.5H4.5V15"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M10 7l5 5-5 5"/></symbol>
    <symbol id="i-commit" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M3 12h5.5M15.5 12H21"/></symbol>
    <symbol id="i-push" viewBox="0 0 24 24"><path d="M12 19V5M6.5 10.5L12 5l5.5 5.5"/></symbol>
    <symbol id="i-merge" viewBox="0 0 24 24"><circle cx="7" cy="5.5" r="2"/><circle cx="7" cy="18.5" r="2"/><circle cx="17" cy="8.5" r="2"/><path d="M7 7.5v9M17 10.5c0 4-4 5.5-9.2 6.4"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M4.5 4.5h7l8 8-7 7-8-8z"/><circle cx="8.6" cy="8.6" r="1.2"/></symbol>
    <symbol id="i-born" viewBox="0 0 24 24"><circle cx="7" cy="6" r="2"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="9" r="2"/><path d="M7 8v8M17 11c0 3-4 4-8.5 5.5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4.5 12h13M12.5 6.5L18 12l-5.5 5.5"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="M15 15l4.5 4.5"/></symbol>
    <symbol id="i-idea" viewBox="0 0 24 24"><path d="M9 17.5h6M10 20.5h4M12 3.5a5.5 5.5 0 0 0-3.3 9.9c.8.6 1.3 1.5 1.3 2.4v.2h4v-.2c0-.9.5-1.8 1.3-2.4A5.5 5.5 0 0 0 12 3.5z"/></symbol>
    <symbol id="i-links" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6c6 0 7.5 3 7.5 9.5" stroke-dasharray="2 2.6"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 6.5h14v9H10l-4 3.5v-3.5H5z"/></symbol>
    <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="7" cy="6" r="2"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="8" r="2"/><path d="M7 8v8M17 10c0 3.5-3 5-8 6"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><rect x="2.5" y="9.5" width="6" height="5" rx="1.6"/><rect x="15.5" y="4" width="6" height="5" rx="1.6"/><rect x="15.5" y="15" width="6" height="5" rx="1.6"/><path d="M8.5 12c4 0 3-5.5 7-5.5M8.5 12c4 0 3 5.5 7 5.5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4.5v11M7 11l5 5 5-5M5 19.5h14"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 15.5v-11M7 9l5-5 5 5M5 19.5h14"/></symbol>
    <symbol id="i-attach" viewBox="0 0 24 24"><path d="M19 11.5l-6.8 6.8a4.5 4.5 0 0 1-6.4-6.4l7.4-7.4a3 3 0 0 1 4.2 4.2l-7.3 7.3a1.5 1.5 0 0 1-2.1-2.1l6.6-6.6"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8.5 5L4.5 9l4 4"/><path d="M4.5 9H14a5 5 0 0 1 0 10h-3"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15.5 5l4 4-4 4"/><path d="M19.5 9H10a5 5 0 0 0 0 10h3"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="10" rx="2.5"/><path d="M19 9v6M16 12h6"/></symbol>
    <symbol id="i-connect" viewBox="0 0 24 24"><rect x="2.5" y="4" width="7" height="6" rx="1.8"/><rect x="14.5" y="14" width="7" height="6" rx="1.8"/><path d="M9.5 7h3A2.5 2.5 0 0 1 15 9.5V14"/><path d="M12.5 11.5L15 14l2.5-2.5"/></symbol>
    <symbol id="i-layer" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" stroke-dasharray="3 2.4"/><path d="M3.5 9h17"/></symbol>
    <symbol id="i-rename" viewBox="0 0 24 24"><path d="M4.5 19.5h4l10-10-4-4-10 10z"/><path d="M13 7.5l4 4"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="16" rx="2"/><rect x="13" y="4" width="8" height="16" rx="2"/><path d="M6 12h10M13.5 9.5L16 12l-2.5 2.5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M9.5 7V4.5h5V7M7 7l1 12.5h8L17 7"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M7 9.5l3 2.5-3 2.5M12.5 15h4"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19.5 4.5v3.5H16"/><circle cx="12" cy="12" r="1.6"/></symbol>
    <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></symbol>
    <symbol id="i-desktop" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="13" rx="2.5"/><path d="M3 8.5h18M9 20.5h6"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.6 3.5 5.4 3.5 8.5s-1.1 5.9-3.5 8.5c-2.4-2.6-3.5-5.4-3.5-8.5s1.1-5.9 3.5-8.5z"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5.5 12.5l4 4 9-9"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><path d="M6 12h.01M12 12h.01M18 12h.01" stroke-width="3"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 2h-14z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></symbol>
  </svg>

  <header class="bar">
    <div class="bar-start">
      <span class="mark" aria-hidden="true"><svg><use href="#i-map"/></svg></span>
      <span class="brand" data-i18n="app.name"></span>
      <div class="project" id="projectPicker">
        <button type="button" class="pp-btn" id="project" aria-haspopup="listbox" aria-expanded="false" aria-controls="projectList">
          <span class="pp-swatch" aria-hidden="true"></span><span class="pp-name" id="projectName"></span><span class="pp-marks" id="projectMarks"></span>
          <svg class="select-chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
        </button>
        <ul class="pp-list" id="projectList" role="listbox" tabindex="-1" data-i18n-aria="project.label" hidden></ul>
      </div>
      <button type="button" class="convs-btn" id="convsBtn" aria-controls="convs" aria-expanded="false"><svg class="btn-icon" aria-hidden="true"><use href="#i-chat"/></svg><span data-i18n="convs.title"></span><span class="convs-btn-n num" id="convsBtnCount"></span></button>
    </div>
    <nav class="tabs" data-i18n-aria="tabs.label">
      <button type="button" class="tab" id="tab-map" aria-current="page" data-i18n="tab.map"></button>
      <button type="button" class="tab" id="tab-flow" aria-current="false" data-i18n="tab.flow"></button>
      <button type="button" class="tab" id="tab-board" aria-current="false" data-i18n="tab.board"></button>
      <button type="button" class="tab" id="tab-history" aria-current="false" data-i18n="tab.history"></button>
      <button type="button" class="tab" id="tab-costs" aria-current="false" data-i18n="tab.costs"></button>
      <button type="button" class="tab" id="tab-discover" aria-current="false" data-i18n="tab.discover"></button>
    </nav>
    <div class="bar-end">
      <button type="button" class="icon-btn bar-icon" id="alertsBtn" aria-haspopup="dialog" aria-controls="alertsDialog" data-i18n-aria="notify.button" data-i18n-title="notify.button"><svg><use href="#i-bell"/></svg></button>
      <div class="lang" role="group" data-i18n-aria="lang.label">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="pt-BR" lang="pt-BR">PT</button>
      </div>
    </div>
  </header>

  <section class="now" id="now" data-i18n-aria="now.label">
    <button type="button" class="now-line" id="nowLine" aria-expanded="true" aria-controls="nowCards">
      <span class="now-title" data-i18n="now.title"></span>
      <span class="now-counts" id="nowCounts"></span>
      <svg class="now-chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
    </button>
    <ul class="now-cards" id="nowCards"></ul>
  </section>

  <aside class="convs" id="convs" aria-labelledby="convsTitle">
    <div class="cv-rail">
      <button type="button" class="cv-rail-btn" id="convsExpand" aria-controls="convsBody" aria-expanded="false" data-i18n-aria="convs.expand" data-i18n-title="convs.expand">
        <svg aria-hidden="true"><use href="#i-chat"/></svg><span class="cv-rail-n num" id="convsRailCount"></span><span class="cv-rail-live" id="convsRailLive" hidden></span>
      </button>
    </div>
    <div class="cv-body" id="convsBody">
      <div class="cv-head">
        <h2 id="convsTitle"><span data-i18n="convs.title"></span> <span class="cv-total num" id="convsTotal"></span></h2>
        <button type="button" class="icon-btn cv-collapse" id="convsCollapse" aria-controls="convsBody" aria-expanded="true" data-i18n-aria="convs.collapse" data-i18n-title="convs.collapse"><svg><use href="#i-sidebar"/></svg></button>
      </div>
      <div class="cv-tools">
        <div class="cv-search">
          <svg class="cv-search-icon" aria-hidden="true"><use href="#i-search"/></svg>
          <label class="visually-hidden" for="convsSearch" data-i18n="convs.searchLabel"></label>
          <input type="search" id="convsSearch" autocomplete="off" data-i18n-placeholder="convs.search">
        </div>
        <div class="seg cv-scope" id="convsScope" role="group" data-i18n-aria="convs.scope">
          <button type="button" data-scope="project" aria-pressed="true" data-i18n="convs.scope.project"></button>
          <button type="button" data-scope="all" aria-pressed="false" data-i18n="convs.scope.all"></button>
        </div>
      </div>
      <div class="cv-filter" id="convsFilter" hidden></div>
      <div class="cv-list" id="convsList" data-i18n-aria="convs.label" role="region"></div>
    </div>
  </aside>
  <div class="cv-scrim" id="convsScrim" hidden></div>

  <main class="stage" id="stage">
    <div class="mm-tools" id="tools">
      <p class="summary" id="summary"></p>
      <div class="mm-actions">
        <div class="mm-search" id="searchBox">
          <svg class="mm-search-icon" aria-hidden="true"><use href="#i-search"/></svg>
          <label class="visually-hidden" for="search" data-i18n="search.label"></label>
          <input type="search" id="search" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="searchResults" aria-autocomplete="list" data-i18n-placeholder="search.placeholder">
          <ul id="searchResults" class="mm-results" role="listbox" data-i18n-aria="search.results" hidden></ul>
        </div>
        <div class="mm-changed" id="changed" role="group" data-i18n-aria="changed.label"></div>
        <button type="button" class="btn mm-rel-btn" id="relations" aria-pressed="false"><svg class="btn-icon" aria-hidden="true"><use href="#i-links"/></svg><span data-i18n="relations.show"></span></button>
        <button type="button" class="btn primary" id="newIdea"><svg class="btn-icon" aria-hidden="true"><use href="#i-idea"/></svg><span data-i18n="idea.button"></span></button>
        <button type="button" id="liveBtn" class="live-btn is-zero" aria-expanded="false" aria-controls="liveList">
          <span class="live-dot" aria-hidden="true"></span><span data-live="label"></span><span class="live-n num" data-live="count"></span>
        </button>
        <button type="button" id="waitingBtn" class="waiting-btn" aria-expanded="false" aria-controls="waitingList">
          <span class="waiting-dot" aria-hidden="true"></span><span id="waitingLabel"></span>
        </button>
      </div>
    </div>

    <section class="arch-banner" id="archBanner" aria-labelledby="archBannerTitle" hidden>
      <div class="arch-banner-text">
        <h2 id="archBannerTitle" data-i18n="arch.bannerTitle"></h2>
        <p data-i18n="arch.bannerLede"></p>
        <ul id="archBannerList"></ul>
        <p class="muted small" data-i18n="arch.bannerSafe"></p>
      </div>
      <button type="button" class="btn primary" id="createArch" data-i18n="arch.create"></button>
    </section>

    <div class="mm-area">
    <div class="mm" id="mindmap" data-i18n-aria="map.label" role="group"></div>
    <div class="ol" id="outline" data-i18n-aria="map.label" role="group"></div>

    <div class="fit-btn zoom-tools" id="zoomTools" role="group" data-i18n-aria="view.zoom">
      <button type="button" id="zoomIn" class="icon-btn" data-i18n-aria="view.zoomIn" data-i18n-title="view.zoomIn"><svg><use href="#i-plus"/></svg></button>
      <button type="button" id="zoomOut" class="icon-btn" data-i18n-aria="view.zoomOut" data-i18n-title="view.zoomOut"><svg><use href="#i-minus"/></svg></button>
      <button type="button" id="fit" class="icon-btn" data-i18n-aria="view.fit" data-i18n-title="view.fit"><svg><use href="#i-fit"/></svg></button>
    </div>

    <section id="relList" class="sheet rel-list" aria-labelledby="relTitle" hidden>
      <div class="sheet-head">
        <div>
          <h2 id="relTitle" data-i18n="rel.title"></h2>
          <p class="meta rel-sub" id="relSub"></p>
        </div>
        <button type="button" class="icon-btn" data-close="rel" data-i18n-aria="panel.close"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="rel-body" id="relBody"></div>
    </section>

    <section id="waitingList" class="sheet waiting-list" aria-labelledby="waitingTitle" hidden>
      <div class="sheet-head">
        <h2 id="waitingTitle" data-i18n="waiting.title"></h2>
        <button type="button" class="icon-btn" data-close="waiting" data-i18n-aria="panel.close"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="seg wl-scope" id="waitingScope" role="group" data-i18n-aria="waiting.scope" hidden>
        <button type="button" data-scope="project" aria-pressed="true"></button>
        <button type="button" data-scope="all" aria-pressed="false"></button>
      </div>
      <ul id="waitingCounts" class="waiting-counts"></ul>
      <ul id="waitingItems"></ul>
    </section>

    <section id="liveList" class="sheet live-list" aria-labelledby="liveTitle" hidden>
      <div class="sheet-head">
        <div>
          <h2 id="liveTitle" data-i18n="live.title"></h2>
          <p class="meta live-sub" data-live="sub"></p>
        </div>
        <button type="button" class="icon-btn" data-close="live" data-i18n-aria="panel.close"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="live-body" data-live="body"></div>
    </section>

    <aside id="panel" class="sheet panel" aria-labelledby="panelTitle" hidden>
      <div class="sheet-head">
        <div id="panelHead"></div>
        <button type="button" class="icon-btn" data-close="panel" data-i18n-aria="panel.close"><svg><use href="#i-close"/></svg></button>
      </div>
      <div id="panelBody" class="panel-body"></div>
    </aside>

    <p class="notice" id="notice" role="status"></p>

    <aside id="chat" class="sheet chat" aria-labelledby="chatTitle" hidden>
      <div class="sheet-resize" id="chatResize" data-i18n-aria="resize.chat" data-i18n-title="resize.chat"></div>
      <div class="sheet-head">
        <div>
          <p class="meta crumbs" id="chatContext" data-chat="context"></p>
          <h2 id="chatTitle" data-chat="title"></h2>
        </div>
        <button type="button" class="icon-btn" data-close="chat" data-chat="close" data-i18n-aria="panel.close"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="seg point-tabs" id="pointTabs" role="tablist" hidden>
        <button type="button" role="tab" id="ptab-chat" aria-selected="true" aria-controls="chatPane" data-i18n="point.chat"></button>
        <button type="button" role="tab" id="ptab-details" aria-selected="false" aria-controls="pointDetails" data-i18n="point.details"></button>
      </div>
      <div class="chat-pane" id="chatPane" role="tabpanel" aria-labelledby="ptab-chat">
        <div class="chat-run" id="chatRun" data-chat="run"></div>
        <div class="run-panel" id="chatRunPanel" data-chat="runpanel" hidden></div>
        <div class="chat-mode">
          <label for="chatMode" data-i18n="chat.modeLabel"></label>
          <select id="chatMode" data-chat="mode"></select>
          <button type="button" class="btn small-btn" id="chatPcMode" data-chat="pcmode" data-i18n="pcmode.button"></button>
        </div>
        <p class="chat-note" id="chatNote" data-chat="note" role="status" hidden></p>
        <div class="chat-where" data-chat="where" hidden></div>
        <ul id="chatList" data-chat="list" class="plain rows chat-list" hidden></ul>
        <div class="chat-find" data-chat="find" hidden></div>
        <ol id="chatLog" data-chat="log" class="chat-log" role="log" aria-live="polite" data-i18n-aria="chat.logLabel"></ol>
        <div class="chat-tasks" data-chat="tasks" hidden></div>
        <form id="chatForm" data-chat="form" class="chat-form">
          <p class="chat-status" id="chatStatus" data-chat="status" role="status"></p>
          <div class="chat-pending" data-chat="pending" hidden></div>
          <label class="visually-hidden" for="chatInput" data-i18n="chat.inputLabel"></label>
          <div class="chat-input-wrap">
            <textarea id="chatInput" data-chat="input" rows="3" maxlength="20000" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="chatSuggest"></textarea>
            <ul class="chat-suggest" id="chatSuggest" data-chat="suggest" role="listbox" data-i18n-aria="chat.suggest" hidden></ul>
          </div>
          <div class="chat-bar">
            <button type="button" class="icon-btn" data-chat="attach" data-i18n-aria="chat.attach" data-i18n-title="chat.attach"><svg><use href="#i-attach"/></svg></button>
            <input type="file" data-chat="filepick" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
            <span class="chat-safety" data-i18n="chat.safety"></span>
            <button type="button" class="btn" id="chatStop" data-chat="stop" hidden><svg class="btn-icon" aria-hidden="true"><use href="#i-stop"/></svg><span data-i18n="chat.stop"></span></button>
            <button type="submit" class="btn primary" id="chatSend" data-chat="send"><svg class="btn-icon" aria-hidden="true"><use href="#i-send"/></svg><span data-i18n="chat.send"></span></button>
          </div>
          <p class="chat-keys" data-i18n="chat.keys"></p>
        </form>
      </div>
      <div class="panel-body point-details" id="pointDetails" role="tabpanel" aria-labelledby="ptab-details" hidden></div>
    </aside>

    </div>

    <section id="view-flow" class="view flow" aria-labelledby="tab-flow" data-mode="view" hidden>
      <div class="fl-bar">
        <div class="fl-heading">
          <h2 id="flowTitle"></h2>
          <p class="fl-source" id="flowSource"></p>
        </div>
        <div class="seg fl-modes" role="group" data-i18n-aria="flow.modes">
          <button type="button" data-mode="view" aria-pressed="true" data-i18n="flow.mode.view"></button>
          <button type="button" data-mode="workshop" aria-pressed="false" data-i18n="flow.mode.workshop"></button>
        </div>
        <div class="fl-actions" id="flowActions">
          <button type="button" class="btn" id="flowCopy"><svg class="btn-icon" aria-hidden="true"><use href="#i-copy"/></svg><span data-i18n="flow.copy"></span></button>
          <details class="menu" id="flowExport">
            <summary class="btn" id="flowExportBtn"><svg class="btn-icon" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="flow.export"></span></summary>
            <div class="menu-pop" role="group" data-i18n-aria="flow.export">
              <button type="button" data-export="svg" data-i18n="flow.export.svg"></button>
              <button type="button" data-export="png" data-i18n="flow.export.png"></button>
              <button type="button" data-export="md" data-i18n="flow.export.md"></button>
              <button type="button" data-export="mmd" data-i18n="flow.export.mmd"></button>
            </div>
          </details>
          <button type="button" class="btn" id="flowImport"><svg class="btn-icon" aria-hidden="true"><use href="#i-import"/></svg><span data-i18n="flow.import"></span></button>
        </div>
      </div>

      <div class="fl-tools" id="flowTools" hidden>
        <div class="fl-toolbar" role="toolbar" data-i18n-aria="flow.tools">
          <div class="fl-group">
            <button type="button" class="fl-tool" data-tool="box" aria-expanded="false"><svg aria-hidden="true"><use href="#i-box"/></svg><span data-i18n="flow.tool.box"></span></button>
            <button type="button" class="fl-tool" data-tool="connect" aria-expanded="false"><svg aria-hidden="true"><use href="#i-connect"/></svg><span data-i18n="flow.tool.connect"></span></button>
            <button type="button" class="fl-tool" data-tool="layer" aria-expanded="false"><svg aria-hidden="true"><use href="#i-layer"/></svg><span data-i18n="flow.tool.layer"></span></button>
            <button type="button" class="fl-tool" data-tool="rename" aria-expanded="false"><svg aria-hidden="true"><use href="#i-rename"/></svg><span data-i18n="flow.tool.rename"></span></button>
            <button type="button" class="fl-tool" data-tool="move" aria-expanded="false"><svg aria-hidden="true"><use href="#i-move"/></svg><span data-i18n="flow.tool.move"></span></button>
            <button type="button" class="fl-tool" data-tool="remove" aria-expanded="false"><svg aria-hidden="true"><use href="#i-trash"/></svg><span data-i18n="flow.tool.remove"></span></button>
          </div>
          <div class="fl-group">
            <button type="button" class="fl-tool" id="flowText" aria-pressed="false"><svg aria-hidden="true"><use href="#i-code"/></svg><span data-i18n="flow.tool.text"></span></button>
            <button type="button" class="fl-tool icon-only" id="flowUndo" data-i18n-aria="flow.undo" data-i18n-title="flow.undo"><svg aria-hidden="true"><use href="#i-undo"/></svg></button>
            <button type="button" class="fl-tool icon-only" id="flowRedo" data-i18n-aria="flow.redo" data-i18n-title="flow.redo"><svg aria-hidden="true"><use href="#i-redo"/></svg></button>
          </div>
          <div class="fl-group fl-end">
            <span class="fl-saved" id="flowSaved" role="status"></span>
            <button type="button" class="btn" id="flowChatToggle" aria-expanded="false" aria-controls="flowChat"><svg class="btn-icon" aria-hidden="true"><use href="#i-chat"/></svg><span data-i18n="flow.chat"></span></button>
            <button type="button" class="btn danger-quiet" id="flowReset" data-i18n="flow.reset"></button>
            <button type="button" class="btn primary" id="flowApply" data-i18n="flow.apply"></button>
          </div>
        </div>
        <form class="fl-form" id="flowForm" hidden></form>
      </div>

      <div class="fl-body" id="flowBody">
        <div class="fl-editor" id="flowEditor" hidden>
          <label class="fl-editor-label" for="flowSourceText" data-i18n="flow.editorLabel"></label>
          <textarea id="flowSourceText" spellcheck="false" autocomplete="off" autocapitalize="off" maxlength="60000"></textarea>
          <p class="fl-editor-error" id="flowEditorError" role="status"></p>
        </div>
        <div class="fl-canvas-wrap">
          <div class="fl-auto" id="flowAuto" role="note" hidden>
            <span class="fl-auto-tag" data-i18n="flow.auto.tag"></span>
            <p data-i18n="flow.auto.text"></p>
            <div class="fl-auto-actions">
              <button type="button" class="btn primary" id="flowAutoImprove" data-i18n="flow.auto.improve"></button>
              <button type="button" class="btn" id="flowAutoSave" data-i18n="flow.auto.save"></button>
            </div>
          </div>
          <div class="fl-canvas" id="flowCanvas" role="group" data-i18n-aria="flow.canvas"></div>
          <ul class="fl-legend" id="flowLegend"></ul>
        </div>
      </div>

      <aside id="flowChat" class="sheet chat fl-chat" aria-labelledby="flowChatTitle" hidden>
        <div class="sheet-resize" id="flowChatResize" data-i18n-aria="resize.chat" data-i18n-title="resize.chat"></div>
        <div class="sheet-head">
          <div>
            <p class="meta crumbs" data-chat="context"></p>
            <h2 id="flowChatTitle" data-chat="title"></h2>
          </div>
          <button type="button" class="icon-btn" data-chat="close" data-i18n-aria="panel.close"><svg><use href="#i-close"/></svg></button>
        </div>
        <div class="chat-pane">
          <div class="chat-run" data-chat="run"></div>
          <div class="run-panel" id="flowChatRunPanel" data-chat="runpanel" hidden></div>
          <div class="chat-mode">
            <label for="flowChatMode" data-i18n="chat.modeLabel"></label>
            <select id="flowChatMode" data-chat="mode"></select>
            <button type="button" class="btn small-btn" data-chat="pcmode" data-i18n="pcmode.button"></button>
          </div>
          <p class="chat-note" data-chat="note" role="status" hidden></p>
          <ul data-chat="list" class="plain rows chat-list" hidden></ul>
          <div class="chat-find" data-chat="find" hidden></div>
          <ol data-chat="log" class="chat-log" role="log" aria-live="polite" data-i18n-aria="chat.logLabel"></ol>
          <div class="chat-tasks" data-chat="tasks" hidden></div>
          <form data-chat="form" class="chat-form">
            <p class="chat-status" data-chat="status" role="status"></p>
            <div class="chat-pending" data-chat="pending" hidden></div>
            <label class="visually-hidden" for="flowChatInput" data-i18n="chat.inputLabel"></label>
            <div class="chat-input-wrap">
              <textarea id="flowChatInput" data-chat="input" rows="3" maxlength="20000" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="flowChatSuggest"></textarea>
              <ul class="chat-suggest" id="flowChatSuggest" data-chat="suggest" role="listbox" data-i18n-aria="chat.suggest" hidden></ul>
            </div>
            <div class="chat-bar">
              <button type="button" class="icon-btn" data-chat="attach" data-i18n-aria="chat.attach" data-i18n-title="chat.attach"><svg><use href="#i-attach"/></svg></button>
              <input type="file" data-chat="filepick" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
              <span class="chat-safety" data-i18n="flow.chatSafety"></span>
              <button type="button" class="btn" data-chat="stop" hidden><svg class="btn-icon" aria-hidden="true"><use href="#i-stop"/></svg><span data-i18n="chat.stop"></span></button>
              <button type="submit" class="btn primary" data-chat="send"><svg class="btn-icon" aria-hidden="true"><use href="#i-send"/></svg><span data-i18n="chat.send"></span></button>
            </div>
            <p class="chat-keys" data-i18n="chat.keys"></p>
          </form>
        </div>
      </aside>
    </section>

    <section id="view-board" class="view" aria-labelledby="tab-board" hidden></section>
    <section id="view-history" class="view" aria-labelledby="tab-history" hidden></section>
    <section id="view-costs" class="view" aria-labelledby="tab-costs" hidden></section>

    <section id="discover" class="discover" aria-labelledby="discoverTitle" hidden>
      <div class="dv-wrap">
        <h2 id="discoverTitle" data-i18n="discover.title"></h2>
        <p class="dv-lede" data-i18n="discover.lede"></p>
        <div class="dv-tools">
          <label class="dv-field"><span class="visually-hidden" data-i18n="discover.searchLabel"></span><input type="search" id="discoverSearch" autocomplete="off"></label>
          <label class="dv-field"><span data-i18n="discover.sort"></span><select id="discoverSort"></select></label>
          <label class="dv-field"><span data-i18n="discover.type"></span><select id="discoverType"></select></label>
          <label class="dv-field"><span data-i18n="discover.category"></span><select id="discoverCategory"></select></label>
          <button type="button" class="btn" id="discoverRefresh" data-i18n="discover.refresh"></button>
        </div>
        <p class="dv-status" id="discoverStatus" role="status"></p>
        <ul class="dv-list" id="discoverList"></ul>
      </div>
      <dialog id="installDialog" class="dv-dialog" aria-label="Install"></dialog>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <ol id="alertStack" class="al-stack" aria-live="polite" data-i18n-aria="notify.stack"></ol>
  <dialog id="alertsDialog" class="dv-dialog al-dialog" aria-labelledby="alertsTitle"></dialog>
  <dialog id="fileDialog" class="file-dialog" aria-labelledby="fileTitle"></dialog>
  <dialog id="confirmDialog" class="dv-dialog" data-i18n-aria="confirm.label"></dialog>
  <dialog id="flowDialog" class="dv-dialog fl-dialog" aria-labelledby="flowDialogTitle"></dialog>
  <dialog id="placeDialog" class="dv-dialog pl-dialog" aria-labelledby="placeTitle"></dialog>

  <script src="vendor/d3-dispatch.min.js"></script>
  <script src="vendor/d3-timer.min.js"></script>
  <script src="vendor/d3-selection.min.js"></script>
  <script src="vendor/d3-color.min.js"></script>
  <script src="vendor/d3-interpolate.min.js"></script>
  <script src="vendor/d3-ease.min.js"></script>
  <script src="vendor/d3-transition.min.js"></script>
  <script src="vendor/d3-drag.min.js"></script>
  <script src="vendor/d3-zoom.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
