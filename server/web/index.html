<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>session-map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%232f7a5f' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%232f7a5f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 5.5v13M15.5 5.5v13"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4.5 9V4.5H9M15 4.5h4.5V9M19.5 15v4.5H15M9 19.5H4.5V15"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
    <symbol id="i-commit" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M3 12h5.5M15.5 12H21"/></symbol>
    <symbol id="i-push" viewBox="0 0 24 24"><path d="M12 19V5M6.5 10.5L12 5l5.5 5.5"/></symbol>
    <symbol id="i-merge" viewBox="0 0 24 24"><circle cx="7" cy="5.5" r="2"/><circle cx="7" cy="18.5" r="2"/><circle cx="17" cy="8.5" r="2"/><path d="M7 7.5v9M17 10.5c0 4-4 5.5-9.2 6.4"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M4.5 4.5h7l8 8-7 7-8-8z"/><circle cx="8.6" cy="8.6" r="1.2"/></symbol>
    <symbol id="i-born" viewBox="0 0 24 24"><circle cx="9" cy="12" r="5"/><circle cx="17.5" cy="12" r="3"/></symbol>
    <symbol id="i-fuse" viewBox="0 0 24 24"><circle cx="13" cy="12" r="6.5"/><circle cx="5.5" cy="7" r="2.2"/><path d="M7.2 8.4l1.6 1.2"/></symbol>
    <symbol id="i-group" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="9.3" cy="10" r="2.6"/><circle cx="14.6" cy="13.8" r="2.6"/></symbol>
    <symbol id="i-rename" viewBox="0 0 24 24"><path d="M14.5 5.5l4 4L9 19H5v-4z"/><path d="M12.5 7.5l4 4"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6M10 4l-.8 6L6.5 13h11l-2.7-3L14 4M12 13v7"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 4v4M12 16v4M4 12h4M16 12h4M7 7l2 2M15 15l2 2M17 7l-2 2M9 15l-2 2"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4.5 12h13M12.5 6.5L18 12l-5.5 5.5"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></symbol>
    <symbol id="i-seed" viewBox="0 0 24 24"><path d="M5 19c0-7 4-12 14-14-1 10-6 14-14 14z"/><path d="M5 19l7-7"/></symbol>
  </svg>

  <header class="bar">
    <div class="bar-start">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11.5" class="mark-membrane"/><circle cx="16" cy="16" r="4.5" class="mark-nucleus"/><circle cx="25" cy="8" r="2.4" class="mark-neuron"/></svg>
      </span>
      <span class="brand" data-i18n="app.name"></span>
      <label class="project">
        <span class="visually-hidden" data-i18n="project.label"></span>
        <select id="project"></select>
        <svg class="select-chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
      </label>
    </div>
    <nav class="tabs" data-i18n-aria="tabs.label">
      <button type="button" class="tab" id="tab-brain" aria-current="page" data-i18n="tab.brain"></button>
      <button type="button" class="tab" id="tab-map" aria-current="false" data-i18n="tab.map"></button>
      <button type="button" class="tab" id="tab-board" aria-current="false" data-i18n="tab.board"></button>
      <button type="button" class="tab" id="tab-history" aria-current="false" data-i18n="tab.history"></button>
      <button type="button" class="tab" id="tab-costs" aria-current="false" data-i18n="tab.costs"></button>
      <button type="button" class="tab" id="tab-discover" aria-current="false" data-i18n="tab.discover"></button>
    </nav>
    <div class="bar-end">
      <div class="lang" role="group" data-i18n-aria="lang.label">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="pt-BR" lang="pt-BR">PT</button>
      </div>
    </div>
  </header>

  <main class="stage" id="stage">
    <svg id="brain" class="brain" role="group"></svg>

    <p class="summary" id="summary"></p>

    <button type="button" id="waitingBtn" class="waiting-btn" aria-expanded="false" aria-controls="waitingList">
      <span class="waiting-dot" aria-hidden="true"></span><span id="waitingLabel"></span>
    </button>

    <section id="waitingList" class="sheet waiting-list" aria-labelledby="waitingTitle" hidden>
      <div class="sheet-head">
        <h2 id="waitingTitle" data-i18n="waiting.title"></h2>
        <button type="button" class="icon-btn" data-close="waiting" data-i18n-aria="panel.close"><svg><use href="#i-close"/></svg></button>
      </div>
      <ul id="waitingItems"></ul>
    </section>

    <aside id="panel" class="sheet panel" aria-labelledby="panelTitle" hidden>
      <div class="sheet-head">
        <div id="panelHead"></div>
        <button type="button" class="icon-btn" data-close="panel" data-i18n-aria="panel.close"><svg><use href="#i-close"/></svg></button>
      </div>
      <div id="panelBody" class="panel-body"></div>
    </aside>

    <details class="legend" id="legend">
      <summary data-i18n="legend.title"></summary>
      <ul>
        <li><svg viewBox="-12 -12 24 24"><circle r="10.5" class="lg-organ"/><circle cx="-3" cy="-1" r="5" class="lg-tissue"/><circle cx="-4" cy="-2" r="1.8" class="lg-cell"/><circle cx="-1.5" cy="1.2" r="1.6" class="lg-cell"/><circle cx="5.5" cy="3" r="3" class="lg-cell"/></svg><span data-i18n="legend.levels"></span></li>
        <li><svg viewBox="-10 -10 20 20"><circle r="5.5" class="lg-busy"/></svg><span data-i18n="legend.busy"></span></li>
        <li><svg viewBox="-10 -10 20 20"><circle r="5.5" class="lg-idle"/></svg><span data-i18n="legend.idle"></span></li>
        <li><svg viewBox="-10 -10 20 20"><circle r="4.2" class="lg-closed"/></svg><span data-i18n="legend.closed"></span></li>
        <li><svg viewBox="-10 -10 20 20"><circle r="7.5" class="lg-waiting"/><path d="M0,-3.6V0.6" class="lg-glyph"/><circle cy="2.9" r="1.1" class="lg-glyph-dot"/></svg><span data-i18n="legend.waiting"></span></li>
        <li><svg viewBox="-10 -10 20 20"><g class="lg-unsure"><circle r="5.6"/><path d="M-1.9,-1.9a1.95,1.95 0 1 1 2.4,1.9c-0.5,0.15-0.5,0.5-0.5,1.1"/><circle class="ask-dot" cy="2.7" r="0.85"/></g></svg><span data-i18n="legend.unsure"></span></li>
        <li><svg viewBox="-10 -10 20 20"><circle r="8" class="lg-bud"/><text class="lg-bud-initial" dy="0.35em" text-anchor="middle">A</text></svg><span data-i18n="legend.branch"></span></li>
        <li><svg viewBox="0 0 28 14"><circle cx="5" cy="7" r="4.5" class="lg-bud lg-clash"/><circle cx="23" cy="7" r="4.5" class="lg-bud lg-clash"/><path d="M9.5,7H18.5" class="lg-clash-bridge"/></svg><span data-i18n="legend.clash"></span></li>
        <li><svg viewBox="0 0 28 12"><path d="M2,6H26" class="lg-tether"/></svg><span data-i18n="legend.tether"></span></li>
        <li><svg viewBox="0 0 28 12"><path d="M2,9Q14,-1 26,9" class="lg-parent"/></svg><span data-i18n="legend.parent"></span></li>
        <li><svg viewBox="0 0 28 12"><path d="M4,8Q14,1 24,8" class="lg-axon"/><circle cx="4" cy="8" r="2.6" class="lg-bulb"/><circle cx="24" cy="8" r="2.6" class="lg-bulb"/></svg><span data-i18n="legend.related"></span></li>
      </ul>
    </details>

    <button type="button" id="fit" class="icon-btn fit-btn" data-i18n-aria="view.fit" data-i18n-title="view.fit"><svg><use href="#i-fit"/></svg></button>

    <p class="notice" id="notice" role="status"></p>

    <aside id="chat" class="sheet chat" aria-labelledby="chatTitle" hidden>
      <div class="sheet-head">
        <div>
          <h2 id="chatTitle"></h2>
          <p class="meta" id="chatContext"></p>
        </div>
        <button type="button" class="icon-btn" data-close="chat" data-i18n-aria="panel.close"><svg><use href="#i-close"/></svg></button>
      </div>
      <ol id="chatLog" class="chat-log" role="log" aria-live="polite" data-i18n-aria="chat.logLabel"></ol>
      <form id="chatForm" class="chat-form">
        <p class="chat-status" id="chatStatus" role="status"></p>
        <label class="visually-hidden" for="chatInput" data-i18n="chat.inputLabel"></label>
        <textarea id="chatInput" rows="3" maxlength="20000"></textarea>
        <div class="chat-bar">
          <span class="chat-safety" data-i18n="chat.safety"></span>
          <button type="button" class="btn" id="chatStop" hidden><svg class="btn-icon" aria-hidden="true"><use href="#i-stop"/></svg><span data-i18n="chat.stop"></span></button>
          <button type="submit" class="btn primary" id="chatSend"><svg class="btn-icon" aria-hidden="true"><use href="#i-send"/></svg><span data-i18n="chat.send"></span></button>
        </div>
      </form>
    </aside>

    <section id="view-map" class="view" aria-labelledby="tab-map" hidden></section>
    <section id="view-board" class="view" aria-labelledby="tab-board" hidden></section>
    <section id="view-history" class="view" aria-labelledby="tab-history" hidden></section>
    <section id="view-costs" class="view" aria-labelledby="tab-costs" hidden></section>

    <section id="discover" class="discover" aria-labelledby="discoverTitle" hidden>
      <div class="dv-wrap">
        <h2 id="discoverTitle" data-i18n="discover.title"></h2>
        <p class="dv-lede" data-i18n="discover.lede"></p>
        <div class="dv-tools">
          <label class="dv-field"><span class="visually-hidden" data-i18n="discover.searchLabel"></span><input type="search" id="discoverSearch" autocomplete="off"></label>
          <label class="dv-field"><span data-i18n="discover.sort"></span><select id="discoverSort"></select></label>
          <label class="dv-field"><span data-i18n="discover.type"></span><select id="discoverType"></select></label>
          <label class="dv-field"><span data-i18n="discover.category"></span><select id="discoverCategory"></select></label>
          <button type="button" class="btn" id="discoverRefresh" data-i18n="discover.refresh"></button>
        </div>
        <p class="dv-status" id="discoverStatus" role="status"></p>
        <ul class="dv-list" id="discoverList"></ul>
      </div>
      <dialog id="installDialog" class="dv-dialog" aria-label="Install"></dialog>
    </section>
  </main>

  <footer class="timeline">
    <button type="button" id="play" class="icon-btn play-btn"><svg><use href="#i-play"/></svg></button>
    <div class="track">
      <svg id="growth" class="growth" aria-hidden="true" preserveAspectRatio="none"></svg>
      <div id="marks" class="marks" aria-hidden="true"></div>
      <input type="range" id="time" min="0" max="1000" step="1" value="1000">
    </div>
    <output id="timeLabel" for="time" class="time-label"></output>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="confirmDialog" class="dv-dialog" data-i18n-aria="confirm.label"></dialog>

  <script src="vendor/d3-dispatch.min.js"></script>
  <script src="vendor/d3-quadtree.min.js"></script>
  <script src="vendor/d3-timer.min.js"></script>
  <script src="vendor/d3-force.min.js"></script>
  <script src="vendor/d3-selection.min.js"></script>
  <script src="vendor/d3-color.min.js"></script>
  <script src="vendor/d3-interpolate.min.js"></script>
  <script src="vendor/d3-ease.min.js"></script>
  <script src="vendor/d3-transition.min.js"></script>
  <script src="vendor/d3-drag.min.js"></script>
  <script src="vendor/d3-zoom.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
