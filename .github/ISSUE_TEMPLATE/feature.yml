name: Feature request
description: An idea for session-map
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation first, the solution second.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
